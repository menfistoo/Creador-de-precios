<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Cotizaciones - Hotel Bahía</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #fcfcfc;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
        }

        header {
            background: white;
            border-bottom: 4px solid #bf600c;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 90px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 40px;
            height: 100%;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header img {
            height: 55px;
            object-fit: contain;
        }

        header .hotel-info h1 {
            font-size: 1.4em;
            color: #1a1a1a;
            margin-bottom: 2px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        header .hotel-info p {
            font-size: 0.75em;
            color: #888;
            margin: 0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-nav {
            display: flex;
            height: 100%;
            gap: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 20px;
            text-decoration: none;
            color: #555;
            font-weight: 600;
            font-size: 0.9em;
            height: 100%;
            transition: all 0.3s;
            position: relative;
        }

        .nav-link:hover {
            color: #bf600c;
            background: #fdf6ec;
        }

        .nav-link.active {
            color: #bf600c;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #bf600c;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 7px 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            font-size: 0.72em;
            font-family: inherit;
        }

        .btn-primary {
            background: #bf600c;
            color: white;
            box-shadow: 0 4px 12px rgba(191, 96, 12, 0.2);
        }

        .btn-primary:hover {
            background: #a3520a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(191, 96, 12, 0.3);
        }

        .btn-secondary {
            background: #fdf6ec;
            color: #bf600c;
            border: 1px solid #bf600c;
        }

        .btn-secondary:hover {
            background: #bf600c;
            color: white;
            transform: translateY(-2px);
        }

        .content {
            padding: 30px;
            flex-grow: 1;
        }

        .history-header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .history-header h2 {
            font-size: 1.8em;
            color: #1a1a1a;
            font-weight: 800;
            position: relative;
            padding-left: 20px;
        }

        .history-header h2::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 80%;
            background: #bf600c;
            border-radius: 10px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95em;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: #bf600c;
            box-shadow: 0 0 0 4px rgba(191, 96, 12, 0.1);
        }

        .advanced-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #eee;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 0.5px;
        }

        .filter-group input,
        .filter-group select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85em;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #bf600c;
        }

        .history-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .history-item {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 25px;
            display: grid;
            grid-template-columns: 80px 1fr 200px 180px;
            align-items: center;
            gap: 30px;
            transition: all 0.3s;
            animation: fadeIn 0.5s ease-out backwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .history-item:hover {
            border-color: #bf600c;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transform: translateX(5px);
        }

        .date-badge {
            text-align: center;
            padding: 10px;
            background: #fdf6ec;
            border-radius: 10px;
            color: #bf600c;
        }

        .date-badge .day {
            font-size: 1.4em;
            font-weight: 800;
            display: block;
            line-height: 1;
        }

        .date-badge .month {
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .client-info h3 {
            font-size: 1.1em;
            color: #1a1a1a;
            margin-bottom: 5px;
        }

        .client-info p {
            font-size: 0.85em;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stay-info {
            font-size: 0.9em;
            color: #555;
        }

        .stay-info div {
            margin-bottom: 4px;
        }

        .price-info {
            text-align: right;
        }

        .price-info .total {
            font-size: 1.4em;
            font-weight: 800;
            color: #bf600c;
            display: block;
        }

        .price-info .details {
            font-size: 0.8em;
            color: #999;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.1em;
        }

        .btn-view {
            background: #eef2ff;
            color: #4f46e5;
        }

        .btn-view:hover {
            background: #4f46e5;
            color: white;
        }

        .btn-delete {
            background: #fff1f2;
            color: #e11d48;
        }

        .btn-delete:hover {
            background: #e11d48;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 5em;
            color: #eee;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 10px;
        }

        footer {
            padding: 20px 40px;
            border-top: 1px solid #eee;
            background: #fcfcfc;
            text-align: center;
            font-size: 0.85em;
            color: #999;
            flex-shrink: 0;
        }

        footer a {
            color: #bf600c;
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .history-item {
                grid-template-columns: 80px 1fr 1fr;
            }

            .price-info {
                grid-column: 2 / 3;
                text-align: left;
            }

            .actions {
                grid-column: 3 / 4;
            }
        }

        @media (max-width: 600px) {
            .history-item {
                grid-template-columns: 1fr;
                gap: 15px;
                text-align: center;
            }

            .date-badge {
                width: 80px;
                margin: 0 auto;
            }

            .price-info {
                text-align: center;
            }

            .actions {
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="logo-section">
                    <img src="logo.png" alt="Hotel Bahía Logo">
                    <div class="hotel-info">
                        <h1>Hotel Bahía</h1>
                        <p>Paguera, Mallorca</p>
                    </div>
                </div>
                <nav class="main-nav">
                    <a href="quotation.html" class="nav-link">
                        <i class="fa-solid fa-calculator"></i> Calculadora
                    </a>
                    <a href="history.html" class="nav-link active">
                        <i class="fa-solid fa-clock-rotate-left"></i> Historial
                    </a>
                </nav>
            </div>
            <div class="header-right">
                <!-- Settings not needed on history page for now -->
            </div>
        </header>

        <main class="content">
            <div class="history-header">
                <h2>Mis Cotizaciones</h2>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por nombre, email o ID..."
                        oninput="filterHistory()">
                </div>
            </div>

            <div class="advanced-filters">
                <div class="filter-group">
                    <label>Desde</label>
                    <input type="date" id="filterDateFrom" onchange="filterHistory()">
                </div>
                <div class="filter-group">
                    <label>Hasta</label>
                    <input type="date" id="filterDateTo" onchange="filterHistory()">
                </div>
                <div class="filter-group">
                    <label>Habitación</label>
                    <select id="filterRoomType" onchange="filterHistory()">
                        <option value="">Todas</option>
                        <option value="Doble">Doble</option>
                        <option value="Doble Económica">Doble Ecón.</option>
                        <option value="Triple">Triple</option>
                        <option value="Individual">Individual</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Idioma</label>
                    <select id="filterLanguage" onchange="filterHistory()">
                        <option value="">Todos</option>
                        <option value="es">Español</option>
                        <option value="en">English</option>
                        <option value="de">Deutsch</option>
                        <option value="fr">Français</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Precio Máx.</label>
                    <input type="number" id="filterMaxPrice" placeholder="€" oninput="filterHistory()">
                </div>
                <div class="filter-group" style="justify-content: flex-end;">
                    <button class="nav-btn" onclick="clearFilters()"
                        style="padding: 8px 12px; font-size: 0.8em; border-width: 1px;">
                        <i class="fa-solid fa-eraser"></i> Limpiar
                    </button>
                </div>
            </div>

            <div id="historyList" class="history-list">
                <!-- History items will be injected here -->
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fa-solid fa-folder-open"></i>
                <h3>No hay cotizaciones aún</h3>
                <p>Las cotizaciones que emitas aparecerán aquí automáticamente.</p>
                <br>
                <a href="quotation.html" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Comenzar ahora
                </a>
            </div>
        </main>

        <footer>
            <p>Hotel Bahía | Cotizador de Precios v1.0</p>
            <p style="margin-top: 8px; font-size: 0.9em;">
                <a href="https://www.hotelbahia.com/" target="_blank"><i class="fa-solid fa-globe"></i> Sitio Web</a> |
                <a href="https://www.booking.com/hotel/es/bahia-peguera.es.html?aid=304142" target="_blank"><i
                        class="fa-solid fa-clipboard-list"></i> Booking.com</a>
            </p>
            <p style="margin-top: 8px; font-size: 0.9em;">© 2026 Hotel Bahía - Todos los derechos reservados</p>
        </footer>
    </div>

    <script src="shared.js"></script>
    <script>
        let fullHistory = [];

        function loadHistory() {
            const saved = localStorage.getItem('hotelBahiaQuotationHistory');
            fullHistory = saved ? JSON.parse(saved) : [];
            // Sort by date descending
            fullHistory.sort((a, b) => new Date(b.dateEmitted) - new Date(a.dateEmitted));
            renderHistory(fullHistory);
        }

        function renderHistory(items) {
            const list = document.getElementById('historyList');
            const empty = document.getElementById('emptyState');

            if (items.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            list.innerHTML = items.map((item, index) => {
                const date = new Date(item.dateEmitted);
                const day = date.getDate();
                const month = date.toLocaleString('es', { month: 'short' });

                return `
                    <div class="history-item" style="animation-delay: ${index * 0.05}s">
                        <div class="date-badge">
                            <span class="day">${day}</span>
                            <span class="month">${month}</span>
                        </div>
                        <div class="client-info">
                            <h3>${item.guestName || 'Cliente sin nombre'}</h3>
                            <p><i class="fa-solid fa-envelope"></i> ${item.guestEmail || 'Sin email'}</p>
                            <p><i class="fa-solid fa-hashtag"></i> ${item.id}</p>
                        </div>
                        <div class="stay-info">
                            <div><i class="fa-solid fa-calendar-days"></i> ${item.nights} noches</div>
                            <div><i class="fa-solid fa-bed"></i> ${item.roomsSummary}</div>
                        </div>
                        <div class="price-info">
                            <span class="total">€ ${formatCurrency(item.totalPrice)}</span>
                            <span class="details">${item.rooms.length} hab - ${item.regime}</span>
                        </div>
                        <div class="actions">
                            <button class="action-btn btn-view" onclick="viewQuotation('${item.id}')" title="Ver / Imprimir">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                            <button class="action-btn btn-delete" onclick="deleteItem('${item.id}')" title="Eliminar">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterHistory() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const dateFrom = document.getElementById('filterDateFrom').value;
            const dateTo = document.getElementById('filterDateTo').value;
            const roomType = document.getElementById('filterRoomType').value;
            const lang = document.getElementById('filterLanguage').value;
            const maxPrice = parseFloat(document.getElementById('filterMaxPrice').value) || Infinity;

            const filtered = fullHistory.filter(item => {
                // Search query
                const matchesQuery = (item.guestName || '').toLowerCase().includes(query) ||
                    (item.guestEmail || '').toLowerCase().includes(query) ||
                    (item.id || '').toLowerCase().includes(query);

                // Date range
                const itemDate = item.dateEmitted.split('T')[0];
                const matchesDateFrom = !dateFrom || itemDate >= dateFrom;
                const matchesDateTo = !dateTo || itemDate <= dateTo;

                // Room Type (check if the summary includes the selected type)
                const matchesRoom = !roomType || (item.roomsSummary || '').includes(roomType);

                // Language
                const matchesLang = !lang || item.language === lang;

                // Price
                const matchesPrice = (item.totalPrice || 0) <= maxPrice;

                return matchesQuery && matchesDateFrom && matchesDateTo && matchesRoom && matchesLang && matchesPrice;
            });
            renderHistory(filtered);
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            document.getElementById('filterRoomType').value = '';
            document.getElementById('filterLanguage').value = '';
            document.getElementById('filterMaxPrice').value = '';
            filterHistory();
        }

        function deleteItem(id) {
            if (confirm('¿Estás seguro de que deseas eliminar esta cotización del historial?')) {
                fullHistory = fullHistory.filter(item => item.id !== id);
                localStorage.setItem('hotelBahiaQuotationHistory', JSON.stringify(fullHistory));
                loadHistory();
            }
        }

        function viewQuotation(id) {
            const item = fullHistory.find(i => i.id === id);
            if (!item) return;

            const lang = item.language || 'es';
            const printContent = generatePrintHTML(item, lang);

            const newWindow = window.open('', '_blank');
            newWindow.document.open();
            newWindow.document.write(printContent);
            newWindow.document.close();

            // Allow resources to load before printing
            setTimeout(() => {
                newWindow.print();
            }, 500);
        }

        // Initialize
        loadHistory();
    </script>
</body>

</html>
