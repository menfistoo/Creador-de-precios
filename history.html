<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Hotel Bahía</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific enhancements for history list items that might be too specific for style.css */
        .history-item {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            display: grid;
            grid-template-columns: 80px 1fr 1fr 120px;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .history-item:hover {
            transform: translateX(5px);
            border-color: var(--primary-color);
        }

        .date-badge {
            text-align: center;
            background: #fff8f1;
            padding: 10px;
            border-radius: 8px;
            color: var(--primary-color);
        }

        .date-badge .day {
            font-size: 1.5em;
            font-weight: 800;
            display: block;
        }

        .date-badge .month {
            text-transform: uppercase;
            font-size: 0.7em;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-view {
            background: #eef2ff;
            color: #4f46e5;
        }

        .btn-delete {
            background: #fff1f2;
            color: #e11d48;
        }

        @media (max-width: 800px) {
            .history-item {
                grid-template-columns: 80px 1fr;
            }

            .price-info {
                grid-column: span 2;
                text-align: left;
                border-top: 1px solid #eee;
                padding-top: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="logo-section">
                    <img src="logo.png" alt="Logo">
                    <div class="hotel-info">
                        <h1>Hotel Bahía</h1>
                        <p>Historial</p>
                    </div>
                </div>
                <nav class="main-nav">
                    <a href="index.html" class="nav-link">
                        <i class="fa-solid fa-calculator"></i> <span class="nav-text">Calculadora</span>
                    </a>
                    <a href="history.html" class="nav-link active">
                        <i class="fa-solid fa-clock-rotate-left"></i> <span class="nav-text">Historial</span>
                    </a>
                </nav>
            </div>
            <div class="header-right">
                <!-- Settings not needed here -->
            </div>
        </header>

        <main class="content" style="display: block;">
            <div class="history-header"
                style="margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <h2 style="border: none;">Mis Cotizaciones</h2>
                <div class="search-box" style="position: relative; flex: 1; max-width: 350px;">
                    <i class="fa-solid fa-magnifying-glass"
                        style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #999;"></i>
                    <input type="text" id="searchInput" placeholder="Buscar..." oninput="filterHistory()"
                        style="padding-left: 35px;">
                </div>
            </div>

            <div class="section" style="margin-bottom: 25px;">
                <div class="grid-3" style="grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));">
                    <div class="filter-group">
                        <label>Desde</label>
                        <input type="date" id="filterDateFrom" onchange="filterHistory()">
                    </div>
                    <div class="filter-group">
                        <label>Hasta</label>
                        <input type="date" id="filterDateTo" onchange="filterHistory()">
                    </div>
                    <div class="filter-group">
                        <label>Habitación</label>
                        <select id="filterRoomType" onchange="filterHistory()">
                            <option value="">Todas</option>
                            <option value="Doble">Doble</option>
                            <option value="Doble Económica">Doble Ecón.</option>
                            <option value="Triple">Triple</option>
                            <option value="Individual">Individual</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Idioma</label>
                        <select id="filterLanguage" onchange="filterHistory()">
                            <option value="">Todos</option>
                            <option value="es">Español</option>
                            <option value="en">English</option>
                            <option value="de">Deutsch</option>
                            <option value="fr">Français</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Precio Máx.</label>
                        <input type="number" id="filterMaxPrice" placeholder="€" oninput="filterHistory()">
                    </div>
                    <div class="filter-group" style="display: flex; align-items: flex-end;">
                        <button class="btn btn-outline" onclick="clearFilters()" style="width: 100%;">
                            <i class="fa-solid fa-eraser"></i> Limpiar
                        </button>
                    </div>
                </div>
            </div>

            <div id="historyList">
                <!-- List items injected here -->
            </div>

            <div id="emptyState" style="text-align: center; padding: 100px 20px; display: none;">
                <i class="fa-solid fa-folder-open"
                    style="font-size: 5em; color: #eee; margin-bottom: 20px; display: block;"></i>
                <h3 style="color: #666;">No hay cotizaciones registradas</h3>
                <p style="color: #999; margin-bottom: 20px;">Las cotizaciones aparecerán aquí automáticamente.</p>
                <a href="index.html" class="btn btn-primary">Crear Cotización</a>
            </div>
        </main>

        <footer>
            © 2026 Hotel Bahía | Paguera, Mallorca
        </footer>
    </div>

    <script src="shared.js"></script>
    <script src="history-logic.js"></script>
</body>

</html>
