<!DOCTYPE html>
<html>
<head>
    <title>Verification Test - Date Formatting Edge Cases</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
        .test { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .pass { background: #e8f5e9; color: #2e7d32; }
        .fail { background: #ffebee; color: #c62828; }
        h2 { border-bottom: 2px solid #bf600c; padding-bottom: 5px; margin-top: 30px; }
        .test-section { margin-bottom: 20px; }
        .summary-box { padding: 20px; border-radius: 8px; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>🗓️ Date Formatting Edge Case Verification (Subtask 4-2)</h1>

    <h2>1. formatDateEuropean() Tests</h2>
    <div id="formatTests" class="test-section"></div>

    <h2>2. Month Rollover Tests</h2>
    <div id="monthRolloverTests" class="test-section"></div>

    <h2>3. Year Rollover Tests</h2>
    <div id="yearRolloverTests" class="test-section"></div>

    <h2>4. Leap Year Tests</h2>
    <div id="leapYearTests" class="test-section"></div>

    <h2>5. Nights Calculation Tests</h2>
    <div id="nightsTests" class="test-section"></div>

    <h2>6. Manual Override Simulation</h2>
    <div id="manualOverrideTests" class="test-section"></div>

    <h2>7. Summary</h2>
    <div id="summary"></div>

    <script src="shared.js"></script>
    <script>
        let passed = 0;
        let failed = 0;

        function test(name, actual, expected, container) {
            const div = document.createElement('div');
            const success = actual === expected;
            div.className = 'test ' + (success ? 'pass' : 'fail');
            div.innerHTML = `<strong>${name}</strong><br>
                Expected: <code>${expected}</code><br>
                Actual: <code>${actual}</code><br>
                ${success ? '✅ PASS' : '❌ FAIL'}`;
            document.getElementById(container).appendChild(div);
            if (success) passed++; else failed++;
        }

        // Simulate auto-checkout logic (from calculator.js onCheckInChange)
        function simulateAutoCheckout(checkInValue) {
            const checkInDate = new Date(checkInValue + 'T00:00:00');
            const checkOutDate = new Date(checkInDate);
            checkOutDate.setDate(checkOutDate.getDate() + 1);
            return checkOutDate.toISOString().split('T')[0];
        }

        // Simulate nights calculation (from calculator.js updateNights)
        function calculateNights(checkIn, checkOut) {
            const d1 = new Date(checkIn + 'T00:00:00');
            const d2 = new Date(checkOut + 'T00:00:00');
            const timeDiff = d2 - d1;
            const nights = Math.ceil(timeDiff / (1000 * 3600 * 24));
            return nights > 0 ? nights : 0;
        }

        // ========== 1. formatDateEuropean Tests ==========
        test('Standard date (2026-01-14)', formatDateEuropean('2026-01-14'), '14/01/2026', 'formatTests');
        test('Single digit day (2026-01-05)', formatDateEuropean('2026-01-05'), '05/01/2026', 'formatTests');
        test('Single digit month (2026-09-15)', formatDateEuropean('2026-09-15'), '15/09/2026', 'formatTests');
        test('Last day of January', formatDateEuropean('2026-01-31'), '31/01/2026', 'formatTests');
        test('Last day of year', formatDateEuropean('2026-12-31'), '31/12/2026', 'formatTests');
        test('Leap year Feb 29', formatDateEuropean('2028-02-29'), '29/02/2028', 'formatTests');
        test('Date object input', formatDateEuropean(new Date('2026-06-15T00:00:00')), '15/06/2026', 'formatTests');

        // ========== 2. Month Rollover Tests ==========
        test('Jan 31 → Feb 1', simulateAutoCheckout('2026-01-31'), '2026-02-01', 'monthRolloverTests');
        test('Feb 28 (non-leap) → Mar 1', simulateAutoCheckout('2026-02-28'), '2026-03-01', 'monthRolloverTests');
        test('Mar 31 → Apr 1', simulateAutoCheckout('2026-03-31'), '2026-04-01', 'monthRolloverTests');
        test('Apr 30 → May 1', simulateAutoCheckout('2026-04-30'), '2026-05-01', 'monthRolloverTests');
        test('Jun 30 → Jul 1', simulateAutoCheckout('2026-06-30'), '2026-07-01', 'monthRolloverTests');
        test('Sep 30 → Oct 1', simulateAutoCheckout('2026-09-30'), '2026-10-01', 'monthRolloverTests');
        test('Nov 30 → Dec 1', simulateAutoCheckout('2026-11-30'), '2026-12-01', 'monthRolloverTests');

        // ========== 3. Year Rollover Tests ==========
        test('Dec 31, 2026 → Jan 1, 2027', simulateAutoCheckout('2026-12-31'), '2027-01-01', 'yearRolloverTests');
        test('Dec 31, 2027 → Jan 1, 2028', simulateAutoCheckout('2027-12-31'), '2028-01-01', 'yearRolloverTests');
        test('Dec 31, 2028 → Jan 1, 2029 (leap year end)', simulateAutoCheckout('2028-12-31'), '2029-01-01', 'yearRolloverTests');

        // ========== 4. Leap Year Tests ==========
        test('Feb 28, 2028 → Feb 29, 2028 (leap year)', simulateAutoCheckout('2028-02-28'), '2028-02-29', 'leapYearTests');
        test('Feb 29, 2028 → Mar 1, 2028 (leap day checkout)', simulateAutoCheckout('2028-02-29'), '2028-03-01', 'leapYearTests');
        test('Feb 28, 2026 → Mar 1, 2026 (non-leap year)', simulateAutoCheckout('2026-02-28'), '2026-03-01', 'leapYearTests');
        test('Feb 28, 2024 → Feb 29, 2024 (leap year 2024)', simulateAutoCheckout('2024-02-28'), '2024-02-29', 'leapYearTests');

        // ========== 5. Nights Calculation Tests ==========
        // After auto-checkout, nights should always be 1
        let autoCheckout1 = simulateAutoCheckout('2026-01-31');
        test('Nights: Jan 31 → Feb 1 = 1 night', calculateNights('2026-01-31', autoCheckout1), 1, 'nightsTests');

        let autoCheckout2 = simulateAutoCheckout('2026-12-31');
        test('Nights: Dec 31 → Jan 1 = 1 night', calculateNights('2026-12-31', autoCheckout2), 1, 'nightsTests');

        let autoCheckout3 = simulateAutoCheckout('2028-02-28');
        test('Nights: Feb 28 → Feb 29 (leap) = 1 night', calculateNights('2028-02-28', autoCheckout3), 1, 'nightsTests');

        // Multiple night stays
        test('Nights: Jan 15 → Jan 20 = 5 nights', calculateNights('2026-01-15', '2026-01-20'), 5, 'nightsTests');
        test('Nights: Dec 28 → Jan 3 (year rollover) = 6 nights', calculateNights('2026-12-28', '2027-01-03'), 6, 'nightsTests');
        test('Nights: Feb 26 → Mar 3 (month rollover) = 5 nights', calculateNights('2026-02-26', '2026-03-03'), 5, 'nightsTests');

        // ========== 6. Manual Override Tests ==========
        // Simulates user changing check-out manually after auto-population
        let checkIn = '2026-01-31';
        let autoPopulated = simulateAutoCheckout(checkIn); // Feb 1
        let manualOverride = '2026-02-05'; // User changes to Feb 5 (4 more nights)
        test('Manual override: Jan 31 → Feb 5 = 5 nights', calculateNights(checkIn, manualOverride), 5, 'manualOverrideTests');

        checkIn = '2026-12-31';
        autoPopulated = simulateAutoCheckout(checkIn); // Jan 1, 2027
        manualOverride = '2027-01-07'; // User extends to Jan 7
        test('Manual override year rollover: Dec 31 → Jan 7 = 7 nights', calculateNights(checkIn, manualOverride), 7, 'manualOverrideTests');

        checkIn = '2028-02-28';
        autoPopulated = simulateAutoCheckout(checkIn); // Feb 29, 2028
        manualOverride = '2028-03-02'; // User extends to Mar 2
        test('Manual override leap year: Feb 28 → Mar 2 = 3 nights', calculateNights(checkIn, manualOverride), 3, 'manualOverrideTests');

        // Edge case: User sets check-out before check-in (should return 0)
        test('Invalid: check-out before check-in = 0 nights', calculateNights('2026-01-15', '2026-01-10'), 0, 'manualOverrideTests');

        // Same day checkout
        test('Same day: check-in = check-out = 0 nights', calculateNights('2026-01-15', '2026-01-15'), 0, 'manualOverrideTests');

        // ========== Summary ==========
        document.getElementById('summary').innerHTML = `
            <div class="test summary-box ${failed === 0 ? 'pass' : 'fail'}">
                <h3 style="margin-top: 0;">Test Results</h3>
                <p><strong>Total Tests:</strong> ${passed + failed}</p>
                <p><strong>Passed:</strong> ${passed} ✅</p>
                <p><strong>Failed:</strong> ${failed} ${failed > 0 ? '❌' : ''}</p>
                <hr style="margin: 15px 0;">
                <h4>${failed === 0 ? '✅ ALL EDGE CASE TESTS PASSED!' : '❌ SOME TESTS FAILED - Review above'}</h4>
                <p style="font-size: 0.9em; color: #666;">
                    <strong>Verified:</strong><br>
                    • Month rollover: Jan 31 → Feb 1 ✓<br>
                    • Year rollover: Dec 31, 2026 → Jan 1, 2027 ✓<br>
                    • Leap year: Feb 28, 2028 → Feb 29, 2028 ✓<br>
                    • Manual check-out override works correctly ✓<br>
                    • Nights calculation correct for all cases ✓
                </p>
            </div>
        `;
    </script>
</body>
</html>
